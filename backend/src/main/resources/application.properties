
spring.application.name=finance-manager-backend

# Secret key
app.secret-key=${SECRET_KEY}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/financemanager?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI / Ollama Configuration (Placeholder)
ai.ollama.api-url=http://localhost:11434/api/generate
ai.ollama.model=llama3

# Server Port
server.port=8085
